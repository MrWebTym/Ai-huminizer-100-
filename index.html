<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Humanizer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Humanizer AI</h1>
            <p>Преврати текст от нейросети в живой и естественный язык без ИИ-детекта.</p>
        </header>

        <main class="editor-grid">
            <div class="card input-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-robot"></i> Текст от ИИ</span>
                    <button id="clear-btn" class="btn-text"><i class="fa-solid fa-trash"></i> Очистить</button>
                </div>
                <textarea id="input-text" placeholder="Вставь сюда текст, сгенерированный ИИ..."></textarea>
                <div class="card-footer">
                    <span id="input-stats">Слов: 0 | Символов: 0</span>
                </div>
            </div>

            <div class="card output-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-user-pen"></i> Очеловеченный текст</span>
                    <button id="copy-btn" class="btn-text"><i class="fa-regular fa-copy"></i> Скопировать</button>
                </div>
                <div id="output-text" class="output-area" contenteditable="false" placeholder="Здесь появится готовый текст..."></div>
                <div class="card-footer">
                    <span id="output-stats">Слов: 0 | Оценка человечности: 100%</span>
                </div>
            </div>
        </main>

        <section class="controls">
            <div class="style-selector">
                <label><i class="fa-solid fa-sliders"></i> Стиль:</label>
                <select id="mode-select">
                    <option value="student">Школьное / Студенческое эссе (Просто и живо)</option>
                    <option value="casual">Разговорный стиль</option>
                    <option value="professional">Понятный деловой стиль</option>
                </select>
            </div>
            <button id="humanize-btn" class="btn-primary"><i class="fa-solid fa-bolt"></i> Очеловечить текст</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
